[cycle]
mode = "income-anchor"
income-account = "income:salary"

[envelope-history]
identities = ["food"]

[[envelope-history.expense-routing]]
effective-from = "initial"
expense-account = "expenses:food"
route = "managed"
target = "food"
note = "initial food route"

[[envelope-history.expense-routing]]
effective-from = "initial"
expense-account = "expenses:transport"
route = "unmanaged"
note = "transport explicitly outside Envelopes"

[daily-target]

[[daily-target.assets]]
id = "cash"
account = "assets:cash"
