[cycle]
mode = "income-anchor"
income-account = "income:salary"

[budget]
unassigned-accounts = ["budget:unassigned"]

[[budget.envelopes]]
id = "food"
allocation-account = "budget:food"

[daily-target]

[[daily-target.assets]]
id = "cash"
account = "assets:cash"

[account-policy.assets]
liquid = ["assets:cash"]
savings = []
investment = []

[account-policy.budget.kind]
opening = ["budget:opening"]
unassigned = ["budget:unassigned"]
spent = ["budget:spent"]
envelope = ["budget:food"]

[account-policy.budget.envelope-role]
unassigned = ["budget:unassigned"]
dynamic = ["budget:food"]
execution = ["budget:spent"]

[account-policy.budget.group]
daily = ["budget:food"]
flex = []
reserve = ["budget:unassigned"]

[account-policy.expenses]
fixed = []
variable = ["expenses:food", "expenses:transport"]
