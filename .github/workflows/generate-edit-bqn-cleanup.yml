name: generate-edit-bqn-cleanup

on:
  push:
    branches:
      - cleanup/post-cutover-test-shells

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cleaned dispatcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/edit-bqn')
          text = p.read_text(encoding='utf-8')

          text = text.replace('PLAN_FILE="$(get_system_default_file DEFAULT_PLAN_FILE plan.tsv)"\n', '')
          text = text.replace('  tools/edit-bqn [--base DIR] plan add --date YYYY-MM-DD --memo MEMO --from ACCOUNT --to ACCOUNT --amount DECIMAL [--currency CODE] [--meta key=value ...] [--id plan-YYYY-MM-DD-series] [--dry-run] [--yes] [--post-check none|lint|full]\n', '')
          text = text.replace('  tools/edit-bqn [--base DIR] plan finish [--index NUMBER] [--id PLAN_ID] --actual-date YYYY-MM-DD [--actual-amount DECIMAL] [--dry-run] [--yes] [--post-check none|lint|full]\n', '')
          text = text.replace('  tools/edit-bqn [--base DIR] plan edit [--index NUMBER] [--id PLAN_ID] [--date YYYY-MM-DD] [--amount DECIMAL] [--all] [--dry-run] [--yes] [--post-check none|lint|full]\n', '')
          text = text.replace('`budget add`, `issue add/list/close`, and `plan add/list/related/finish/edit`)', '`budget add`, `issue add/list/close`, and `plan list/related`)')
          text = text.replace('account add/list, journal add/multi-add, budget/plan/issue add, explicit-path journal-block add, travel friend/exchange add, issue list/close, journal list/cleanup-plan/cleanup-apply/reverse, and plan list/related/finish/edit', 'account add/list, journal add/multi-add, budget add, issue add/list/close, explicit-path journal-block add, travel friend/exchange add, journal list/cleanup-plan/cleanup-apply/reverse, and plan list/related')

          def remove_between(source, start, end):
              a = source.index(start)
              b = source.index(end, a)
              return source[:a] + source[b:]

          text = remove_between(
              text,
              'if [[ "$1" == "plan" && "$2" == "edit" ]]; then\n',
              'if [[ "$1" == "plan" && "$2" == "finish" ]]; then\n',
          )
          text = remove_between(
              text,
              'if [[ "$1" == "plan" && "$2" == "finish" ]]; then\n',
              'if [[ "$1" == "plan" && "$2" == "list" ]]; then\n',
          )

          text = text.replace('plan add, plan list, plan related, plan finish, and plan edit', 'plan list and plan related')
          text = text.replace('plan add, plan list, plan related, plan finish, and plan edit', 'plan list and plan related')
          text = text.replace('  plan)\n    EXPECTED_TARGET_FILE="$PLAN_FILE"\n    PREVIEW_TITLE="Plan"\n    ROW_TITLE="Plan row"\n    ;;\n', '')
          text = text.replace('if [[ "$COMMAND" != "journal" && "$COMMAND" != "plan" && -n "$CURRENCY" ]]; then\n  echo "ERROR: --currency is currently supported only for journal, Budget, and Plan add" >&2\n', 'if [[ "$COMMAND" != "journal" && -n "$CURRENCY" ]]; then\n  echo "ERROR: --currency is currently supported only for journal and Budget add" >&2\n')

          tail = 'TARGET_PATH="$BASE_DIR/$EXPECTED_TARGET_FILE"\n'
          if tail not in text:
              raise SystemExit('expected legacy Plan-add tail not found')
          text = text[:text.index(tail)]
          text = text.rstrip() + '\n'

          forbidden = [
              'DEFAULT_PLAN_FILE',
              'src_edit/plan_add_cmd.bqn',
              'src_edit/plan_edit_cmd.bqn',
              'src_edit/plan_finish_cmd.bqn',
              '[[ "$1" == "plan" && "$2" == "add" ]]',
              '[[ "$1" == "plan" && "$2" == "edit" ]]',
              '[[ "$1" == "plan" && "$2" == "finish" ]]',
          ]
          found = [x for x in forbidden if x in text]
          if found:
              raise SystemExit(f'forbidden Plan mutation residue: {found}')
          for required in ['plan_list_cmd.bqn', 'plan_related_cmd.bqn', 'journal-block', 'issue" && "$2" == "close"']:
              if required not in text:
                  raise SystemExit(f'required dispatcher route lost: {required}')

          Path('generated').mkdir(exist_ok=True)
          Path('generated/edit-bqn').write_text(text, encoding='utf-8')
          PY
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-edit-bqn
          path: generated/edit-bqn
          if-no-files-found: error
