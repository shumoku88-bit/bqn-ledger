name: bqn-action-catalog-experiment

on:
  pull_request:
    paths:
      - 'experiments/bqn/add_ui_action_catalog.bqn'
      - 'experiments/bqn/add_ui_action_catalog.md'
      - 'experiments/bqn/add_ui_action_export.bqn'
      - 'experiments/bqn/add_ui_action_export_consumer.sh'
      - 'experiments/bqn/add_ui_action_metadata.tsv'
      - 'experiments/bqn/add_ui_action_export.md'
      - '.github/workflows/bqn-action-catalog-experiment.yml'
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    env:
      CBQN_REF: master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CBQN
        run: |
          git clone --depth 1 --branch "$CBQN_REF" https://github.com/dzaima/CBQN.git
          make -C CBQN -j$(nproc)
          sudo cp CBQN/BQN /usr/local/bin/bqn

      - name: Run add-ui action catalog probe
        run: bqn experiments/bqn/add_ui_action_catalog.bqn

      - name: Run add-ui metadata export boundary probe
        run: bash experiments/bqn/add_ui_action_export_consumer.sh
