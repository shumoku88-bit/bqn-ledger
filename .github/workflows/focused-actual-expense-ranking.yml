name: focused actual expense ranking

on:
  pull_request:
    branches: [main]

jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      CBQN_REF: master
    steps:
      - uses: actions/checkout@v4

      - name: Install CBQN
        run: |
          git clone --depth 1 --branch "$CBQN_REF" https://github.com/dzaima/CBQN.git
          make -C CBQN -j$(nproc)
          sudo cp CBQN/BQN /usr/local/bin/bqn

      - name: Capture focused output
        id: focused
        continue-on-error: true
        run: |
          set +e
          bqn tests/test_src_next_actual_expense_ranking.bqn > focused.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload focused output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-actual-expense-ranking-log
          path: focused.log
          if-no-files-found: error

      - name: Preserve focused failure
        if: always()
        run: test "${{ steps.focused.outputs.status }}" = "0"
