name: repo-index-diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate repository index baseline
        shell: bash
        run: |
          tools/repo-index --baseline
          test -s tools/.repo-index-baseline.tsv
          tools/repo-index --diff
          wc -l tools/.repo-index-baseline.tsv
          sha256sum tools/.repo-index-baseline.tsv
