name: ytd-diagnostic

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      CBQN_REF: master
    steps:
      - uses: actions/checkout@v4

      - name: Install CBQN
        run: |
          git clone --depth 1 --branch "$CBQN_REF" https://github.com/dzaima/CBQN.git
          make -C CBQN -j$(nproc)
          sudo cp CBQN/BQN /usr/local/bin/bqn

      - name: Capture YTD diagnostics
        shell: bash
        run: |
          mkdir -p diagnostic
          set +e
          bqn tests/test_src_next_ytd_summary.bqn >diagnostic/unit.out 2>diagnostic/unit.err
          echo "$?" >diagnostic/unit.code
          bash checks/check-src-next-ytd-unavailable-cycle.sh >diagnostic/focused.out 2>diagnostic/focused.err
          echo "$?" >diagnostic/focused.code
          tools/report fixtures/envelopes-disabled-policy --section ytd --no-color >diagnostic/direct.out 2>diagnostic/direct.err
          echo "$?" >diagnostic/direct.code
          set -e

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ytd-diagnostic
          path: diagnostic/
          if-no-files-found: error

      - name: Fail if diagnostics failed
        shell: bash
        run: |
          test "$(cat diagnostic/unit.code)" = 0
          test "$(cat diagnostic/focused.code)" = 0
          test "$(cat diagnostic/direct.code)" = 0
