name: diagnose-command-hub-browse

on:
  pull_request:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      CBQN_REF: master
    steps:
      - uses: actions/checkout@v4

      - name: Install CBQN quietly
        run: |
          git clone -q --depth 1 --branch "$CBQN_REF" https://github.com/dzaima/CBQN.git
          make -s -C CBQN -j$(nproc) >/dev/null
          sudo cp CBQN/BQN /usr/local/bin/bqn

      - name: Install tools quietly
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq ripgrep >/dev/null

      - name: Run browse-cache check
        run: |
          set +e
          bash checks/check-command-hub-browse-cache.sh >browse-cache.log 2>&1
          status=$?
          printf '%s\n' "$status" >browse-cache.status
          cat browse-cache.log
          exit "$status"

      - name: Upload browse-cache diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browse-cache-diagnostic
          path: |
            browse-cache.log
            browse-cache.status
          if-no-files-found: error
