name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      CBQN_REF: master
    steps:
      - uses: actions/checkout@v4

      - name: Synchronize topology code map on branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if grep -q 'SRC_NEXT_MODULE_TOPOLOGY_AUDIT-2026-07-26.md' docs/AI_CODEMAP.md; then
            exit 0
          fi
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          python3 tools/apply-src-next-topology-codemap.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/AI_CODEMAP.md
          git commit -m 'docs: align code map with src_next topology audit'
          git push origin HEAD:"$HEAD_BRANCH"

      - name: Install CBQN
        run: |
          git clone --depth 1 --branch "$CBQN_REF" https://github.com/dzaima/CBQN.git
          echo "CBQN commit: $(git -C CBQN rev-parse HEAD)"
          make -C CBQN -j$(nproc)
          sudo cp CBQN/BQN /usr/local/bin/bqn

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Src next topology summary
        run: |
          mkdir -p topology-audit/current-docs
          python3 tools/src-next-import-graph --summary --validate | tee topology-audit/summary.tsv
          python3 tools/src-next-import-graph --modules --validate > topology-audit/modules.tsv
          python3 tools/src-next-import-graph --cycles --validate > topology-audit/cycles.tsv
          python3 tools/src-next-import-graph --validate > topology-audit/edges.tsv
          cp docs/ARCHITECTURE.md topology-audit/current-docs/ARCHITECTURE.md
          cp docs/AI_CODEMAP.md topology-audit/current-docs/AI_CODEMAP.md
          cp docs/README.md topology-audit/current-docs/README.md

      - name: Upload topology evidence
        uses: actions/upload-artifact@v4
        with:
          name: src-next-topology-audit
          path: topology-audit/

      - name: Run check.sh
        run: bash tools/check.sh

      - name: Coverage
        run: bash tools/coverage
