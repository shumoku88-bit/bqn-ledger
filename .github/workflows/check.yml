name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      CBQN_REF: master
    steps:
      - uses: actions/checkout@v4

      - name: Install CBQN
        run: |
          git clone --depth 1 --branch "$CBQN_REF" https://github.com/dzaima/CBQN.git
          echo "CBQN commit: $(git -C CBQN rev-parse HEAD)"
          make -C CBQN -j$(nproc)
          sudo cp CBQN/BQN /usr/local/bin/bqn

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Projection diagnostic execution
        run: |
          set +e
          bqn src_next/main.bqn fixtures/src-next-golden > projection-diagnostic.log 2>&1
          status=$?
          echo "$status" > projection-diagnostic.status
          cat projection-diagnostic.log
          exit "$status"

      - name: Upload projection diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-diagnostic-log
          path: |
            projection-diagnostic.log
            projection-diagnostic.status

      - name: Projection diagnostic golden
        run: bash checks/check-src-next-golden.sh fixtures/src-next-golden

      - name: Projection diagnostic ownership
        run: bash checks/check-projection-diagnostic-presentation.sh

      - name: Run check.sh
        run: bash tools/check.sh

      - name: Coverage
        run: bash tools/coverage
