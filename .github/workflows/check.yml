name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      CBQN_REF: master
    steps:
      - uses: actions/checkout@v4

      - name: Install CBQN
        run: |
          git clone --depth 1 --branch "$CBQN_REF" https://github.com/dzaima/CBQN.git
          echo "CBQN commit: $(git -C CBQN rev-parse HEAD)"
          make -C CBQN -j$(nproc)
          sudo cp CBQN/BQN /usr/local/bin/bqn

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Named inspection execution
        run: bqn src_next/developer_inspection.bqn fixtures/src-next-golden >/dev/null

      - name: Main compatibility execution
        run: bqn src_next/main.bqn fixtures/src-next-golden >/dev/null

      - name: Inspection compatibility check
        run: bash checks/check-developer-inspection-entrypoint.sh fixtures/src-next-golden

      - name: Projection presentation ownership
        run: bash checks/check-projection-diagnostic-presentation.sh

      - name: Golden check
        run: bash checks/check-src-next-golden.sh fixtures/src-next-golden

      - name: Repo index check
        run: bash checks/check-repo-index.sh

      - name: Run check.sh
        run: bash tools/check.sh

      - name: Coverage
        run: bash tools/coverage
